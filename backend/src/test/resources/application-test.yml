spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-0123456789abcdef
    access-expiry-minutes: 15
    refresh-expiry-days: 7
  email:
    provider: log
  exercises-dataset-path: ""
