spring:
  application:
    name: workoutsmart-backend

  config:
    # Đọc file .env nếu tồn tại (bỏ qua khi không có) — format .properties
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workoutsmart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-stacktrace: never

app:
  jwt:
    # Bắt buộc set qua biến môi trường. KHÔNG commit giá trị thật (constitution §5).
    secret: ${JWT_SECRET:}
    access-expiry-minutes: 15
    refresh-expiry-days: 7
  email:
    # log = ghi OTP ra log (dev); smtp = Gmail SMTP; sendgrid = SendGrid API
    provider: ${EMAIL_PROVIDER:log}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-address: ${MAIL_USERNAME:noreply@workoutsmart.app}
  exercises-dataset-path: ${EXERCISES_DATASET_PATH:../exercises-dataset/data/exercises.json}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
