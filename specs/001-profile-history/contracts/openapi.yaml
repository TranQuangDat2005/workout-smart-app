openapi: 3.0.3
info:
  title: WorkoutSmartApp — Profile & History API
  version: 0.1.0
servers:
  - url: /api/v1

paths:
  /profile:
    get:
      summary: Xem hồ sơ cá nhân (FR-001)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin hồ sơ (không gồm passwordHash)
    put:
      summary: Sửa hồ sơ — tên, ảnh, tuổi, chiều cao, mục tiêu (FR-002..004)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 100 }
                avatarUrl: { type: string, maxLength: 500 }
                age: { type: integer, minimum: 10, maximum: 120 }
                heightCm: { type: number, exclusiveMinimum: 0, maximum: 300 }
                goalType: { type: string, enum: [weight_loss, muscle_gain, endurance] }
      responses:
        "200":
          description: Hồ sơ đã cập nhật + goalChanged (true nếu mục tiêu đổi)
        "400":
          description: Dữ liệu không hợp lệ

  /account:
    delete:
      summary: Xóa tài khoản (soft-delete 30 ngày) (FR-005)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đã chuyển trạng thái deleted, revoke mọi phiên

  /workout-sessions:
    get:
      summary: Lịch sử buổi tập phân trang (FR-006)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Page gồm content (id, startTime, endTime, status, totalSets, totalVolumeKg)

  /workout-sessions/{id}:
    get:
      summary: Chi tiết 1 buổi tập với từng hiệp (FR-007)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chi tiết session + danh sách sets
        "404":
          description: Không tồn tại hoặc không thuộc user

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
